    <style>
        body{
            background:#111;
            color:white;

        .player-container{
            width:90%;
            max-width:1400px;
            margin:40px auto;
        }

        h1{
            margin-bottom:20px;
        }

        .video{
            aspect-ratio:16/9;
            width:100%;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 0 20px rgba(0,0,0,.5);
        }

        .video iframe{
            width:100%;
            height:100%;
            border:none;
        }

        .controls{
            margin-top:25px;
            display:flex;
            justify-content:space-between;
            gap:15px;
        }

        .controls a{
            background:#d4af37;
            color:#000;
            text-decoration:none;
            padding:12px 22px;
            border-radius:8px;
            font-weight:bold;
            transition:.25s;
        }

        .controls a:hover{
            transform:translateY(-2px);
        }
    </style>
